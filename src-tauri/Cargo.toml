[package]
name = "gienemy"
version = "0.1.0"
description = "Fan, keyboard and power control for the Gigabyte GAMING A16"
authors = ["laroca00"]
edition = "2021"
license = "MIT"

[lib]
# Distinct lib name avoids a bin/lib filename clash on Windows (cargo#8519).
name = "gienemy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Wmi",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_System_Console",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
